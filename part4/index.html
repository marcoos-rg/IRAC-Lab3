<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grupo 4 IRAC</title>

  <link rel="stylesheet" href="styles.css">

  <script src="dash.all.min.js"></script>
  <script src="chart.min.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <h1>Grupo 4 IRAC</h1>

  <div class="video-container">
    <video class="dashjs-player" autoplay controls preload="auto" muted></video>
  </div>

  <div class="metrics">
    <p>Video Bitrate: <span id="bitrate">N/A</span> kbps</p>
    <p>Video Buffer: <span id="buffer">N/A</span> seconds</p>
    <p>Video Representation: <span id="representation">N/A</span></p>
  </div>

  <div class="charts">
    <div class="chart-box">
      <h3>Bitrate and Buffer over time</h3>
      <canvas id="metricsChart"></canvas>
    </div>
  </div>
</body>
</html>
